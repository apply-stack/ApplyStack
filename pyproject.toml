[project]
name = "applystack"
version = "0.1.0"
description = "Job / Internship Finder API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2.0",
    "alembic",
    "asyncpg",
]

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes: undefined names, unused imports/variables
    "I",    # isort: import ordering
    "B",    # flake8-bugbear: likely bugs (mutable defaults, etc.)
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade: modernize syntax for the target version
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line length is owned by the formatter, not the linter
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
